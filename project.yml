name: maclm-agent

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"

targets:
  maclm-agent:
    type: application
    platform: macOS
    sources:
      - path: maclm-agent
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: 0.1.1
        PRODUCT_BUNDLE_IDENTIFIER: local.maclm-agent
        PRODUCT_NAME: maclm-agent
        SWIFT_EMIT_LOC_STRINGS: true

  maclm-agentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: maclm-agentTests
    dependencies:
      - target: maclm-agent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: local.maclm-agentTests
        SWIFT_VERSION: "6.0"

schemes:
  maclm-agent:
    build:
      targets:
        maclm-agent: all
        maclm-agentTests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - maclm-agentTests
    run:
      config: Debug
