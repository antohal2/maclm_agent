name: maclm-agent

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"

targets:
  maclm-agent:
    type: application
    platform: macOS
    sources:
      - path: maclm-agent
        excludes:
          - Resources/Pets
      - path: maclm-agent/Resources/Pets
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: Carbon.framework
      - sdk: Security.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        SWIFT_OBJC_BRIDGING_HEADER: maclm-agent/Support/RegexValidation.h
        OTHER_LDFLAGS: "$(inherited) -licucore"
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: 0.4.8
        PRODUCT_BUNDLE_IDENTIFIER: local.maclm-agent
        PRODUCT_NAME: maclm-agent
        SWIFT_EMIT_LOC_STRINGS: true

  maclm-agentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: maclm-agentTests
    preBuildScripts:
      - name: Copy source catalog for localization completeness test
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/maclm-agent/Localizable.xcstrings" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/LocalizableCatalog.json"
        inputFiles:
          - $(SRCROOT)/maclm-agent/Localizable.xcstrings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LocalizableCatalog.json
    dependencies:
      - target: maclm-agent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: local.maclm-agentTests
        SWIFT_VERSION: "6.0"

schemes:
  maclm-agent:
    build:
      targets:
        maclm-agent: all
        maclm-agentTests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - maclm-agentTests
    run:
      config: Debug
